<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naija Brain</title>
<style>
:root{--yellow:#f2b705;--ink:#14110f;--green:#0f6b4b;--paper:#f3f5f2;--line:#d9ddd7}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);display:flex;flex-direction:column}header{background:var(--yellow);border-bottom:6px solid var(--ink);padding:14px 18px 10px}header h1{margin:0;font-size:1.55rem;font-weight:800}header p{margin:2px 0 0;font-size:.88rem}main{flex:1;overflow-y:auto;padding:16px 14px;max-width:720px;width:100%;margin:0 auto}.msg{max-width:86%;margin:0 0 10px;padding:10px 13px;line-height:1.45;white-space:pre-wrap}.bot{background:#fff;border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:2px 12px 12px 12px}.me{background:var(--green);color:#fff;margin-left:auto;border-radius:12px 2px 12px 12px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}.chips button{font:inherit;font-size:.9rem;background:#fff;border:1.5px solid var(--ink);border-radius:999px;padding:7px 13px;cursor:pointer}form{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);max-width:720px;width:100%;margin:0 auto}input{flex:1;font:inherit;font-size:1rem;padding:11px 13px;border:1.5px solid var(--ink);border-radius:10px;min-width:0}form button{font:inherit;font-weight:700;background:var(--ink);color:var(--yellow);border:0;border-radius:10px;padding:0 18px;cursor:pointer}.err{color:#9b1c1c}
</style></head><body>
<header><h1>Naija Brain</h1><p>Built in Nigeria. Runs on its own engine, no outside AI.</p></header>
<main id="log" aria-live="polite"><div class="msg bot">How far! Ask me about Nigeria in English or Pidgin.</div><div class="chips" id="chips"></div></main>
<form id="f" autocomplete="off"><input id="q" placeholder="Type here, e.g. wetin be JAMB?" aria-label="Your message" maxlength="500"><button type="submit">Send</button></form>
<script>
const log=document.getElementById("log"),q=document.getElementById("q"),chips=document.getElementById("chips");const session=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2));
["What is the capital of Nigeria?","Wetin be JAMB?","20% of 5000","Tell me a joke"].forEach(t=>{const b=document.createElement("button");b.type="button";b.textContent=t;b.onclick=()=>send(t);chips.appendChild(b)});
function add(text,cls){const d=document.createElement("div");d.className="msg "+cls;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
async function send(text){text=text.trim();if(!text)return;chips.remove();add(text,"me");q.value="";try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session,message:text})});if(!r.ok)throw new Error(r.status);const data=await r.json();add(data.reply||data.error||"I couldn't answer that yet.","bot")}catch(e){add("I couldn't reach the Naija Brain engine. Please try again.","bot err")}}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();send(q.value)});
</script></body></html>
